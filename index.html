<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kaushalji QR Generator</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--primary-orange:#ff6b00;--secondary-orange:#ff8c00;--card-bg:#ffffff;--text-main:#2d3748;--text-muted:#718096;--border-color:#ffe0cc;}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
body{background-color:var(--primary-orange);background-image:radial-gradient(circle at 50% 10%,#ff8c00 0%,#e65c00 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;color:var(--text-main);}
.app-shell{width:100%;max-width:450px;height:100vh;max-height:850px;background-color:var(--card-bg);border-radius:36px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.35);display:flex;flex-direction:column;overflow:hidden;position:relative;border:6px solid #fff;}
@media(max-width:480px){.app-shell{height:100vh;max-height:none;border-radius:0;border:none;box-shadow:none;}}
.app-header{background:linear-gradient(135deg,#ff6b00 0%,#ff8c00 100%);color:white;padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom-left-radius:24px;border-bottom-right-radius:24px;box-shadow:0 4px 12px rgba(255,107,0,0.2);}
.app-header h1{font-size:17px;font-weight:800;letter-spacing:0.5px;}
.app-header p{font-size:11px;opacity:0.9;}
.header-actions{display:flex;gap:6px;}
.icon-btn{background:rgba(255,255,255,0.25);border:none;color:#fff;padding:6px 10px;border-radius:10px;font-size:11px;font-weight:600;cursor:pointer;transition:background 0.2s;}
.icon-btn:hover{background:rgba(255,255,255,0.4);}
.app-body{flex:1;overflow-y:auto;padding:20px;background-color:var(--card-bg);scroll-behavior:smooth;}
.app-body::-webkit-scrollbar{width:5px;}
.app-body::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px;}
.card-panel{background-color:var(--card-bg);border:1px solid var(--border-color);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.02);transition:all 0.3s ease;}
.card-panel:hover{box-shadow:0 4px 12px rgba(255,107,0,0.08);}
.section-title{font-size:13px;font-weight:700;color:#4a5568;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.form-group{margin-bottom:12px;}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
.form-input{width:100%;padding:12px 14px;background-color:#fafafa;border:1.5px solid #edf2f7;border-radius:12px;font-size:14px;color:var(--text-main);transition:all 0.2s ease;}
.form-input:focus{outline:none;border-color:var(--primary-orange);background-color:#ffffff;box-shadow:0 0 0 3px rgba(255,107,0,0.15);}
.btn-primary{width:100%;background:linear-gradient(135deg,#ff6b00 0%,#ff8c00 100%);color:white;font-weight:700;padding:13px;border-radius:12px;border:none;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(255,107,0,0.35);transition:transform 0.1s ease;margin-top:4px;}
.btn-primary:active{transform:scale(0.98);}
.btn-secondary{background-color:#10b981;color:white;font-weight:600;padding:10px 16px;border-radius:12px;border:none;font-size:13px;cursor:pointer;width:100%;transition:background-color 0.2s ease;}
.btn-secondary:hover{background-color:#059669;}
.qr-display-box{text-align:center;display:none;animation:fadeIn 0.4s ease forwards;}
.qr-wrapper{background:#ffffff;padding:16px;border-radius:16px;display:inline-block;border:1px dashed #cbd5e1;margin-bottom:12px;}
.history-table-container{max-height:220px;overflow-y:auto;}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f1f5f9;}
.history-item:last-child{border-bottom:none;}
.history-info h4{font-size:13px;font-weight:700;color:#2d3748;}
.history-info p{font-size:11px;color:var(--text-muted);margin-top:2px;}
.history-amount{font-size:13px;font-weight:800;color:#e65c00;}
.app-footer{background-color:#ffffff;border-top:1px solid #edf2f7;padding:12px;text-align:center;font-size:11px;color:var(--text-muted);font-weight:500;}
.clear-btn{font-size:11px;color:#e53e3e;background:none;border:none;cursor:pointer;font-weight:600;}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:1000;}
.modal-content{background:#fff;padding:22px;border-radius:24px;width:90%;max-width:340px;box-shadow:0 10px 25px rgba(0,0,0,0.2);animation:fadeIn 0.3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div class="app-shell">
<header class="app-header">
<div>
<h1>Kaushalji QR Generator</h1>
<p>Instant UPI & Expense Tracker</p>
</div>
<div class="header-actions">
<button id="topShareBtn" class="icon-btn">Share</button>
<button id="infoBtn" class="icon-btn">Info</button>
</div>
</header>
<div class="app-body">
<div class="card-panel">
<div class="section-title">New Payment Details</div>
<form id="upiForm">
<div class="form-group"><label class="form-label">UPI ID or Mobile Number</label><input type="text" id="upiId" class="form-input" required placeholder="e.g. 9876543210@paytm"></div>
<div class="form-group"><label class="form-label">Amount (&#8377;)</label><input type="number" id="amount" class="form-input" step="0.01" required placeholder="0.00"></div>
<div class="form-group"><label class="form-label">Description / Note</label><input type="text" id="description" class="form-input" required placeholder="e.g. Dinner expense"></div>
<button type="submit" class="btn-primary">Generate QR Code</button>
</form>
</div>
<div id="qrContainer" class="card-panel qr-display-box">
<div class="section-title">Scan QR to Pay</div>
<div class="qr-wrapper"><div id="qrcode"></div></div>
<p id="qrDetails" style="font-size:12px;color:#4a5568;margin-bottom:12px;font-weight:500;"></p>
<button id="shareBtn" class="btn-secondary">Share Payment Link</button>
</div>
<div class="card-panel">
<div class="section-title"><span>Recent History</span><button onclick="clearHistory()" class="clear-btn">Clear All</button></div>
<div class="history-table-container"><div id="historyList"></div></div>
</div>
</div>
<footer class="app-footer">Secured Local Storage PWA &bull; Kaushalji Apps</footer>
</div>

<!-- Info Modal -->
<div id="infoModal" class="modal-overlay">
<div class="modal-content">
<h3 style="font-size:15px;font-weight:800;color:#2d3748;margin-bottom:14px;">App Settings & Support</h3>
<div class="form-group">
<label class="form-label">Change Accent Theme</label>
<select id="themeSelector" class="form-input">
<option value="#ff6b00">Classic Orange</option>
<option value="#2563eb">Royal Blue</option>
<option value="#7c3aed">Deep Purple</option>
<option value="#059669">Emerald Green</option>
</select>
</div>
<div style="display:flex;flex-direction:column;gap:8px;margin:16px 0;">
<a href="tel:919129191898" style="display:block;background:#f8fafc;border:1px solid #e2e8f0;padding:10px;border-radius:12px;text-decoration:none;color:#2d3748;font-size:12px;font-weight:700;text-align:center;">📞 Support Call: +91 9129191898</a>
<a href="https://wa.me/919129191898?text=Hello%20Kaushalji,%20I%20need%20help%20with%20UPI%20App" target="_blank" style="display:block;background:#dcfce7;color:#166534;padding:10px;border-radius:12px;text-decoration:none;font-size:12px;font-weight:700;text-align:center;">💬 Support WhatsApp: 9129191898</a>
</div>
<button id="closeModal" class="btn-primary" style="margin-top:0;">Close Panel</button>
</div>
</div>

<script>
if('serviceWorker'in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(e=>console.log('SW failed',e));});}
const f=document.getElementById('upiForm'),q=document.getElementById('qrContainer'),d=document.getElementById('qrcode'),dt=document.getElementById('qrDetails'),hl=document.getElementById('historyList'),sb=document.getElementById('shareBtn'),topSb=document.getElementById('topShareBtn'),infoBtn=document.getElementById('infoBtn'),infoModal=document.getElementById('infoModal'),closeModal=document.getElementById('closeModal'),themeSelector=document.getElementById('themeSelector');let inst=null,sd={title:'Kaushalji QR Generator',text:'Check out this fast UPI QR Generator App!',url:window.location.href};
document.addEventListener('DOMContentLoaded',loadHistory);
f.addEventListener('submit',e=>{e.preventDefault();const u=document.getElementById('upiId').value.trim(),a=document.getElementById('amount').value.trim(),ds=document.getElementById('description').value.trim(),now=new Date(),tStr=now.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});let fu=u.includes('@')?u:u+'@paytm',us=`upi://pay?pa=${encodeURIComponent(fu)}&am=${encodeURIComponent(a)}&tn=${encodeURIComponent(ds)}&cu=INR`;d.innerHTML='';inst=new QRCode(d,{text:us,width:180,height:180});q.style.display='block';q.scrollIntoView({behavior:'smooth'});dt.innerHTML=`Paying <strong>&#8377;${a}</strong> to <strong>${u}</strong>`;sd={title:'UPI Payment',text:`Pay \u20b9${a} for "${ds}". UPI: ${fu}`,url:us};saveToLocalStorage({dateTime:tStr,upiId:u,description:ds,amount:a});f.reset();loadHistory();});
sb.addEventListener('click',async()=>{if(navigator.share){try{await navigator.share(sd);}catch(e){}}else{alert('Sharing not supported.');}});
topSb.addEventListener('click',async()=>{if(navigator.share){try{await navigator.share({title:'Kaushalji QR',text:'Use this UPI App',url:window.location.href});}catch(e){}}else{alert('Sharing not supported.');}});
infoBtn.addEventListener('click',()=>infoModal.style.display='flex');
closeModal.addEventListener('click',()=>infoModal.style.display='none');
themeSelector.addEventListener('change',(e)=>{const val=e.target.value;document.documentElement.style.setProperty('--primary-orange',val);document.body.style.backgroundColor=val;});
function saveToLocalStorage(tx){let h=JSON.parse(localStorage.getItem('upi_transactions'))||[];h.unshift(tx);localStorage.setItem('upi_transactions',JSON.stringify(h));}
function loadHistory(){let h=JSON.parse(localStorage.getItem('upi_transactions'))||[];hl.innerHTML='';if(h.length===0){hl.innerHTML=`<div style="text-align:center;color:#a0aec0;font-size:12px;padding:20px;">No transactions found.</div>`;return;}h.forEach(item=>{const div=document.createElement('div');div.className='history-item';div.innerHTML=`<div class="history-info"><h4>${item.upiId}</h4><p>${item.description} &bull; ${item.dateTime}</p></div><div class="history-amount">&#8377;${item.amount}</div>`;hl.appendChild(div);});}
function clearHistory(){if(confirm('Delete all history?')){localStorage.removeItem('upi_transactions');loadHistory();}}
</script>
</body>
</html>
